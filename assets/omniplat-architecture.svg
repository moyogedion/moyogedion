<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="561" viewBox="0 0 1000 561" role="img" aria-labelledby="title desc"><title id="title">OmniPlat digital banking architecture</title><desc id="desc">Customer, staff and agent channels use shared onboarding, servicing, payment and control workflows, with connections to bank records, payment networks and operations.</desc><rect x="0" y="0" width="1000" height="561" rx="22" fill="#122722" stroke="none"/><text x="27" y="37" fill="#b7dcc5" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.75">ARCHITECTURE  /  OMNIPLAT</text><text x="26" y="89" fill="#fbf8ed" font-family="Georgia, Times New Roman, serif" font-size="49" font-weight="400">One set of rules across channels</text><text x="28" y="124" fill="#c1dccb" font-family="system-ui, Arial, sans-serif" font-size="18" font-weight="400">Each channel can evolve without duplicating the bank’s transaction rules.</text><rect x="27" y="153" width="290" height="292" rx="15" fill="#1b392f" stroke="#507265"/><text x="46" y="183" fill="#bfe3c8" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.75">01</text><text x="46" y="223" fill="#f8f7eb" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="400">Channels</text><text x="46" y="249" fill="#c3dbcc" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="400">Where people start</text><path d="M46 264H298V264" stroke="#57796a" fill="none"/><text x="46" y="290" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Customers</text><text x="46" y="310" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Mobile, web, WhatsApp and USSD</text><text x="46" y="342" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Staff and agents</text><text x="46" y="362" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Onboarding, approvals and support</text><text x="46" y="394" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Business clients</text><text x="46" y="414" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Corporate and agency workflows</text><rect x="355" y="153" width="290" height="292" rx="15" fill="#1b392f" stroke="#507265"/><text x="374" y="183" fill="#bfe3c8" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.75">02</text><text x="374" y="223" fill="#f8f7eb" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="400">Shared workflows</text><text x="374" y="249" fill="#c3dbcc" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="400">What stays consistent</text><path d="M374 264H626V264" stroke="#57796a" fill="none"/><text x="374" y="290" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Onboarding and servicing</text><text x="374" y="310" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Identity, mandates and account access</text><text x="374" y="342" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Payments</text><text x="374" y="362" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Validate and route instructions</text><text x="374" y="394" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Controls</text><text x="374" y="414" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Roles, approvals, limits and audit</text><rect x="683" y="153" width="290" height="292" rx="15" fill="#1b392f" stroke="#507265"/><text x="702" y="183" fill="#bfe3c8" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.75">03</text><text x="702" y="223" fill="#f8f7eb" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="400">Bank services</text><text x="702" y="249" fill="#c3dbcc" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="400">Where records and rails connect</text><path d="M702 264H954V264" stroke="#57796a" fill="none"/><text x="702" y="290" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Core banking</text><text x="702" y="310" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Accounts, balances and posting</text><text x="702" y="342" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Payment and card networks</text><text x="702" y="362" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Transfers, switching and settlement</text><text x="702" y="394" fill="#f6f9f1" font-family="system-ui, Arial, sans-serif" font-size="16" font-weight="650">Operations</text><text x="702" y="414" fill="#bedaCB" font-family="system-ui, Arial, sans-serif" font-size="13.5" font-weight="400">Reconciliation and exception handling</text><path d="M320 295h28m-10 -6 10 6-10 6" stroke="#b2d8b9" stroke-width="1.5" fill="none"/><path d="M648 295h28m-10 -6 10 6-10 6" stroke="#b2d8b9" stroke-width="1.5" fill="none"/><rect x="27" y="468" width="946" height="65" rx="11" fill="#cce8d0" stroke="none"/><text x="45" y="495" fill="#245340" font-family="system-ui, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.75">DESIGN RULE</text><text x="45" y="518" fill="#192d25" font-family="system-ui, Arial, sans-serif" font-size="17" font-weight="550">Add a channel without copying controls. Keep a clear record from instruction to reconciliation.</text></svg>
